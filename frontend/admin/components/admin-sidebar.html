<!-- ========== Sidebar Fragment ========== -->
<div th:fragment="sidebar">
  <header class="site-sidebar">
    <div class="sidebar__block">
      <h1 class="sidebar__menu">サイドメニュー</h1>
    </div>

    <!-- ========== サイドバー ========== -->
    <nav id="nav__bar">
      <ul class="nav__list">
        <li class="nav__list nav__list--gallery">
          <p>ギャラリー管理</p>
          <ul>
            <li class="nav__item">
              <a th:href="@{/admin/admin-gallery.html}">ギャラリー</a>
            </li>
            <li class="nav__item">
              <a th:href="@{/admin/admin-gallery-form.html}">ギャラリー新規作成</a>
            </li>
          </ul>
        </li>

        <li class="nav__list nav__list--recruit">
          <p>採用情報管理</p>
          <ul>
            <li class="nav__item">
              <a th:href="@{/admin/admin-recruit.html}">採用情報</a>
            </li>
            <li class="nav__item">
              <a th:href="@{/admin/admin-recruit-form.html}">採用情報新規作成</a>
            </li>
          </ul>
        </li>

        <li class="nav__list nav__list--logout-button">
          <p>ログアウト</p><!--うごかん-->
          <form th:action="@{/admin/logout}" method="post">
            <input type="hidden"
                  th:name="${_csrf.parameterName}"
                  th:value="${_csrf.token}" />
            <button type="submit">ログアウト</button>
          </form>
        </li>
      </ul>
    </nav>
  </header>
</div>
